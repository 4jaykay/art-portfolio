<style>
  * {
    box-sizing: border-box;
  }

  /* Two-column gallery */
  .row {
    margin: 8px -40px;
    padding: 8px;
  }

  .row > .column {
    padding: 8px;
  }

  .column {
    float: left;
    width: 50%;
  }

  .column img {
    margin-top: 18px;
  }

  /* Clear each two-column gallery */
  .row:after {
    content: "";
    display: table;
    clear: both;
  }

  h3 {
  margin-top: 50px;
  margin-bottom: -20px;
}

/* Centered single images */
.etude-single-images {
  clear: both;
  text-align: center;
  padding-top: 20px;
  padding-bottom: 60px;
}

.etude-single-images h3 {
  margin-top: 0;
  margin-bottom: 15px;
}

.column60 {
  width: 60%;
  margin-left: auto;
  margin-right: auto;
  margin-bottom: 60px;
}

.column65 {
  width: 65%;
  margin-left: auto;
  margin-right: auto;
}

.column60 img,
.column65 img {
  display: block;
  width: 100%;
}

  /* X-ray and Composite */
.single-etudes {
  clear: both;
  padding-top: 70px;
  padding-bottom: 75px;
}

.single-etude {
  text-align: center;
  margin-bottom: 70px;
}

.single-etude h3 {
  margin: 0 0 20px 0;
}

.single-etude .column60,
.single-etude .column65 {
  margin-left: auto;
  margin-right: auto;
}

.single-etude:last-child {
  margin-bottom: 0;
}
  /* Études modal positioning */
  .modal-content {
    top: 46%;
  }

.modal-old-etudes .modal-content {
  max-width: 850px;
}

.modal-old-etudes .modal-content img {
  max-height: 85vw;
}

/* Tablet / smaller screens */
@media screen and (max-width: 900px) {
  .row {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 8px 0;
    padding: 0;
  }

  .column {
    width: 70%;
    padding: 0;
  }

  /* Single-image section */
  .etude-single-images {
    padding-top: 10px;
    padding-bottom: 20px;
    gap: 20px;
  }

  .etude-single-images h3 {
    margin-top: 0;
    margin-bottom: 5px;
  }

  .column60,
  .column65 {
    width: 75%;
  }

  .single-etudes {
  padding-top: 20px;
  padding-bottom: 20px;
}

.single-etude {
  margin-bottom: 30px;
}

.single-etude h3 {
  margin-top: 0;
  margin-bottom: 10px;
}

.single-etude:last-child {
  margin-bottom: 0;
}

h3 {
  margin-bottom: 10px;
  
}
    .etude-first .column {
    width: 70%;
  }

  .etude-last .column {
    width: 85%;
  }
}

/* Phones */
@media screen and (max-width: 600px) {
  .column {
    width: 110%;
    margin-left: -10%;
    margin-right: -10%;
  }

  .column60,
  .column65 {
    width: 105%;
    margin-left: -2.5%;
    margin-right: -2.5%;
    transform: none;
  }

  .row,
  .row > .column {
    padding: 0;
  }

  .etude-single-images {
    padding-top: 0;
    padding-bottom: 20px;
    gap: 10px;
  }

  .etude-single-images h3 {
    margin-top: 0;
    margin-bottom: 5px;
    font-weight: 600; 
  }

  .single-etudes {
  padding-top: 20px;
  padding-bottom: 20px;
}

.single-etude {
  margin-bottom: 30px;
}

.single-etude h3 {
  margin-top: 0;
  margin-bottom: 15px;
}

.single-etude:last-child {
  margin-bottom: 0;
}

h3 {
  margin-bottom: 15px;
  font-size: 24px;
  front-weight: 550px;
  }
  
    .etude-first .column {
    width: 110%;
    margin-left: -10%;
    margin-right: -10%;
  }

  .etude-last .column {
    width: 105%;
    margin-left: -5%;
    margin-right: -5%;
    transform: none;
  }
}
</style>

     <script>
     document.addEventListener("DOMContentLoaded", function() {

  var originalShowSlides = showSlides;

  showSlides = function(n) {
    originalShowSlides(n);

    var modal = document.getElementById("myModal");

     if (slideIndex >= 7 && slideIndex <= 12) {
      modal.classList.add("modalwhite");
      modal.classList.add("modal-old-etudes");
    } else {
      modal.classList.remove("modalwhite");
      modal.classList.remove("modal-old-etudes");
    }
