    <style>
      * {
        box-sizing: border-box;
      }

      .row {
        margin: 8px -40px;
      }

      /* Add padding BETWEEN each column */
      .row,
      .row > .column {
        padding: 8px;
      }

      /* Create two equal columns that floats next to each other */
      .column {
        float: left;
        width: 50%;
      }

      .column img {
        margin-top: 18px;
      }

       /* One center column 70% */
      .column65 {
       width: 65%;
       justify-content: center;
       margin-left: auto;
       margin-right: auto;
      }

      .column65 img {
        margin-top: 35px;  
      }

      .column60 {
       width: 60%;
       justify-content: center;
       margin-left: auto;
       margin-right: auto;
      }

       .column60 img {
        margin-top: 35px;
      }

      /* Clear floats after rows */ 
      .row:after {
        content: "";
        display: table;
        clear: both;
      } 

    .row:first-of-type .column:first-child img:first-child {
      margin-top: 0;
      }

      .modal-content {
      top: 46%;
      }

      /* Responsive layout - makes the two columns stack on top of each other instead of next to each other */
      @media screen and (max-width: 600px) {
     .row {
    margin: 8px 0;
  }
    .column {
    width: 100%;
  }
}
