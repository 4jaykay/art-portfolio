<style>
  * {
    box-sizing: border-box;
  }

  /* Two-column gallery */
  .row {
    margin: 8px -40px;
    padding: 8px;
  }

  .row > .column {
    padding: 8px;
  }

  .column {
    float: left;
    width: 50%;
  }

  .column img {
    margin-top: 18px;
  }

  /* Clear each two-column gallery */
  .row:after {
    content: "";
    display: table;
    clear: both;
  }

  h3 {
  margin-bottom: -10px;
}

 /* Centered single images */
.etude-single-images {
  clear: both;
  padding-top: 30px;
  padding-bottom: 50px;
}

.column60 {
  width: 60%;
  margin-left: auto;
  margin-right: auto;
}

.column65 {
  width: 65%;
  margin-left: auto;
  margin-right: auto;
}

.column60 img {
  display: block;
  margin-top: 0;
}

.column65 img {
  display: block;
  margin-top: 35px;
}
  /* Études modal positioning */
  .modal-content {
    top: 46%;
  }

  /* Mobile */
  @media screen and (max-width: 600px) {

    .row {
      margin: 8px 0;
    }

    .column {
      width: 100%;
    }

    .column60,
    .column65 {
      width: 100%;
    }

    .etude-single-images {
      margin-top: 30px;
      margin-bottom: 50px;
    }

    .column60 img,
    .column65 img {
      margin-top: 35px;
    }

  }
</style>

     document.addEventListener("DOMContentLoaded", function() {

  var originalShowSlides = showSlides;
